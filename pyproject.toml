[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-epics"
# Single-sourced from isaac_epics.__version__ (see [tool.setuptools.dynamic]).
# Two copies of a version number is one copy too many: the one that gets
# forgotten is whichever is not the one you are looking at during a release.
dynamic = ["version"]
description = "EPICS / Bluesky adapter layer for NVIDIA Isaac Sim digital twins"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Advanced Photon Source" }]
keywords = ["EPICS", "Channel Access", "Isaac Sim", "digital twin", "bluesky", "ophyd", "beamline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "caproto>=1.1",
]

[project.urls]
Homepage = "https://github.com/AdvancedPhotonSource/EPICS-IsaacSim"
Source = "https://github.com/AdvancedPhotonSource/EPICS-IsaacSim"
Issues = "https://github.com/AdvancedPhotonSource/EPICS-IsaacSim/issues"

[project.optional-dependencies]
mirror = ["caproto>=1.1"]
bluesky = ["ophyd>=1.9", "bluesky>=1.13", "ipython>=8"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
isaac-epics-ioc = "isaac_epics.cli:main"
isaac-epics-mirror = "isaac_epics.mirror:main"
isaac-epics-console = "isaac_epics.console:main"
isaac-epics-tick = "isaac_epics.tickfile:main"

[tool.setuptools.dynamic]
version = { attr = "isaac_epics.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # The adapter targets Python 3.9 (the stock interpreter on APS RHEL 9.8
    # hosts, which is what lets it run there without a new Python). Explicit
    # `typing.Dict` / `typing.Optional` imports are kept deliberately rather
    # than relying on `from __future__ import annotations` to make PEP 585 and
    # PEP 604 syntax safe at runtime on that version.
    "UP006",
    "UP035",
    "UP037",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# The tick client is copied into Isaac Sim's embedded interpreter as a single
# standalone file and must stay maximally portable. Explicit `object` bases and
# percent-formatting are intentional conservatism, not oversights. It ships
# inside the package so that a pip install is enough to obtain it.
"src/isaac_epics/isaacsim_client/*" = ["UP004", "UP031"]
# Isaac Sim requires SimulationApp to be constructed before any other import,
# so module-level imports cannot all sit at the top.
# The bridge runs inside Isaac Sim's embedded interpreter and is kept
# stylistically close to the digital-twin prototype it mirrors.
"examples/isaacsim_standalone.py" = ["E402", "UP031"]
"examples/fake_sim.py" = ["E402"]
"examples/bluesky_scan.py" = ["E402"]
"tests/*" = ["E402"]
